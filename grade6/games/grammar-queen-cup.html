<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grammar Queen Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--rose:#ff4f9a;--roseD:#c8246f;--lav:#8f5cf7;--lavD:#5b2fc9;--plum:#3b1238;--ink:#4b2142;--muted:#8b6584;--gold:#ffd166;--goldD:#e0a92e;--mint:#1fbf86;--coral:#ff5a6e;--line:#f3cfe2;
  --round:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;--script:'Pacifico','Brush Script MT','Snell Roundhand',cursive}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#f6dcec;font-family:var(--round);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(circle at 10% 10%,#ffd9ea 0,transparent 35%),radial-gradient(circle at 90% 5%,#e6d8ff 0,transparent 38%),radial-gradient(circle at 85% 95%,#ffe0ef 0,transparent 35%),radial-gradient(circle at 5% 95%,#efe4ff 0,transparent 35%),#fff3f9}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block;animation:fin .35s ease}
@keyframes fin{from{opacity:0}}
button{font:inherit;cursor:pointer;border:none;color:inherit}
textarea{font:inherit}
.btn{white-space:nowrap;font-size:28px;font-weight:700;padding:16px 34px;border-radius:999px;background:linear-gradient(135deg,#ff7ab6,#ff4f9a 55%,#c552f0);color:#fff;box-shadow:0 6px 0 #b0306f;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b0306f}
.btn.g{background:#fff;color:var(--roseD);box-shadow:0 6px 0 #f0bcd6}
.btn.s{font-size:22px;padding:10px 22px;box-shadow:0 4px 0 #f0bcd6}
.btn.s:not(.g){box-shadow:0 4px 0 #b0306f}
.btn:disabled{opacity:.4}
.panel{background:#fff;border-radius:30px;box-shadow:0 18px 40px rgba(214,73,141,.16)}
.topbar{position:absolute;left:0;right:0;top:0;height:110px;display:flex;align-items:center;gap:18px;padding:0 40px}
.topbar h2{font-family:var(--script);font-weight:400;font-size:46px;color:var(--rose)}
.sp{flex:1}
.row{display:flex;align-items:center;gap:16px}
.lab{font-size:26px;font-weight:700;color:var(--plum)}
.lab small{font-weight:500;color:var(--muted);font-size:21px}
.note{font-size:22px;color:var(--muted);line-height:1.45}
.pm{width:60px;height:60px;border-radius:50%;background:var(--rose);color:#fff;font-size:34px;font-weight:700;flex:none}
.big{font-size:44px;font-weight:700;color:var(--plum);min-width:150px;text-align:center}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font-size:21px;font-weight:600;padding:10px 16px;border-radius:999px;background:#fff0f6;color:var(--muted);border:3px solid transparent}
.seg button.on{background:#fff;color:var(--rose);border-color:var(--rose)}
/* home */
.title{font-family:var(--script);font-weight:400;font-size:130px;line-height:1.15;background:linear-gradient(90deg,#ff4f9a,#c552f0 55%,#8f5cf7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding:0 20px 18px}
.clsc{width:310px;padding:26px 10px;border-radius:30px;background:#fff;border:4px solid #ffd3e6;box-shadow:0 14px 30px rgba(214,73,141,.16);transition:transform .15s}
.clsc:hover,.clsc:active{transform:translateY(-6px) scale(1.03);border-color:var(--rose)}
.clsc .cn{font-size:62px;font-weight:700;color:var(--rose)}
.clsc:nth-child(even) .cn{color:var(--lav)}
.floaty{position:absolute;font-size:40px;font-weight:600;color:rgba(200,36,111,.08);white-space:nowrap;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-500px)}to{transform:translateX(2400px)}}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
/* setup */
.chipgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chip{font-size:21px;font-weight:600;padding:10px 12px;border-radius:16px;background:#fff0f6;color:var(--plum);border:3px solid #ffb3d4;text-align:left;display:flex;align-items:center;gap:10px;min-width:0}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ck{width:30px;height:30px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.chip.off{background:#f6f1f4;color:#c0aab9;border-color:#eadde5;text-decoration:line-through}
.chip.off .ck{background:#d9c8d2}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ltog{display:flex;align-items:center;gap:8px;text-align:left;font-size:18px;font-weight:600;line-height:1.15;padding:8px 10px;border-radius:14px;border:3px solid #eee3ea;background:#fff;color:#b9a3b4;min-height:62px}
.ltog .em{font-size:24px;flex:none}
.ltog.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--plum)}
.stog{font-size:20px;font-weight:600;padding:9px 16px;border-radius:999px;border:3px solid #eee3ea;background:#fff;color:#b9a3b4}
.stog.on{border-color:var(--lav);background:#f5f0ff;color:var(--lavD)}
.paste{width:100%;height:230px;border-radius:20px;border:3px dashed #ffb3d4;background:#fff7fb;padding:14px;font-size:20px;resize:none;color:var(--ink)}
.paste:focus{outline:none;border-color:var(--rose)}
/* bracket */
#bk{position:absolute;left:30px;right:30px;top:180px;bottom:24px;display:flex;gap:16px}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.col h4{color:var(--lav);font-size:20px;text-align:center;letter-spacing:2px;margin-bottom:6px;height:28px}
.col .ms{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.mb{background:#fff;border:3px solid #fff;border-radius:14px;overflow:hidden;color:var(--muted);font-size:18px;box-shadow:0 6px 16px rgba(214,73,141,.12)}
.mb .pl{display:flex;align-items:center;padding:3px 10px;gap:6px;height:27px;white-space:nowrap;overflow:hidden}
.mb .pl+.pl{border-top:2px dotted var(--line)}
.mb .pl .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.mb .pl .sc{font-weight:700;min-width:22px;text-align:right}
.mb .pl.w{color:var(--plum);font-weight:700;background:linear-gradient(90deg,#fff1c2,#fff)}
.mb .pl.l{opacity:.45;text-decoration:line-through}
.mb.ready{border-color:#ffb3d4;cursor:pointer;color:var(--plum)}
.mb.next{border-color:var(--rose);animation:glow 1.4s infinite alternate}
.mb.bye{opacity:.45;box-shadow:none}
@keyframes glow{to{box-shadow:0 0 0 6px rgba(255,79,154,.25),0 0 30px rgba(255,79,154,.45)}}
.timebox{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:8px 20px;font-size:21px;box-shadow:0 6px 16px rgba(214,73,141,.12)}
.timebox b{color:var(--rose);font-size:28px}
.timebox .pm{width:42px;height:42px;font-size:24px}
/* ready */
.vs{position:absolute;inset:0;display:flex}
.vs .side{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff}
.L{background:linear-gradient(160deg,#ff7ab6 0%,#e0307f 100%)}
.R{background:linear-gradient(200deg,#a98bff 0%,#5b2fc9 100%)}
.vs .nm{font-size:80px;font-weight:700;text-align:center;line-height:1.05;padding:0 40px;text-shadow:0 6px 0 rgba(0,0,0,.15)}
.vs .av{width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.22);border:8px solid #fff;display:grid;place-items:center;font-size:80px;font-weight:700}
.vsbadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220px;height:220px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--script);font-size:96px;color:var(--rose);box-shadow:0 0 0 14px rgba(255,255,255,.35),0 20px 50px rgba(59,18,56,.3);animation:vsp 1s ease infinite alternate}
@keyframes vsp{to{transform:translate(-50%,-50%) scale(1.08) rotate(-4deg)}}
.slideL{animation:sl .6s cubic-bezier(.2,1.3,.4,1) both}.slideR{animation:sr .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes sl{from{transform:translateX(-500px);opacity:0}}@keyframes sr{from{transform:translateX(500px);opacity:0}}
.rules{display:flex;gap:16px;justify-content:center}
.rules div{background:rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:12px 20px;font-size:23px;font-weight:600;max-width:440px}
/* match */
.half{position:absolute;top:0;bottom:0;width:960px;padding:150px 30px 24px}
.half.L{left:0}.half.R{right:0}
.half::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 80%,rgba(255,255,255,.12) 0,transparent 30%),radial-gradient(circle at 80% 30%,rgba(255,255,255,.1) 0,transparent 25%);pointer-events:none}
.ph{position:relative;display:flex;align-items:center;gap:18px;color:#fff;height:96px}
.half.L .ph{padding-right:300px}.half.R .ph{flex-direction:row-reverse;text-align:right;padding-left:300px}
.ph .nm{font-size:40px;font-weight:700;flex:1;line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.15);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.ph .score{font-size:88px;font-weight:700;min-width:140px;text-align:center;background:rgba(255,255,255,.22);border-radius:26px;line-height:1.08}
.ph .streak{font-size:30px;font-weight:700;color:var(--gold);min-width:90px}
.qc{position:relative;margin-top:14px;height:290px;background:#fff;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:44px 28px 16px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.12)}
.qc .qt{font-size:20px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;position:absolute;top:14px;left:22px;display:flex;gap:10px;align-items:center}
.qc .qt i{font-style:normal;background:#fff0f6;color:var(--roseD);border-radius:999px;padding:2px 12px}
.half.R .qc .qt i{background:#f3eeff;color:var(--lavD)}
.qc .pass{position:absolute;top:10px;right:14px;font-size:19px;font-weight:700;padding:6px 14px;border-radius:999px;background:#f6eef3;color:var(--muted)}
.qc .qq{font-size:44px;font-weight:600;color:var(--ink);line-height:1.3}
.qc .qq .blank{display:inline-block;min-width:110px;border-bottom:5px solid var(--rose);margin:0 6px;transform:translateY(-6px)}
.half.R .qc .qq .blank{border-color:var(--lav)}
.qc .ask{font-size:28px;font-weight:600;color:var(--muted)}
.qc.good{animation:okf .5s}.qc.bad{animation:shake .45s}
@keyframes okf{0%{box-shadow:0 0 0 0 rgba(31,191,134,.9)}100%{box-shadow:0 0 0 40px rgba(31,191,134,0)}}
@keyframes shake{20%{transform:translateX(-18px)}40%{transform:translateX(18px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
.reveal{position:absolute;inset:0;border-radius:28px;background:rgba(59,18,56,.93);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:40px;font-weight:700;padding:20px;line-height:1.25}
.reveal small{font-size:22px;color:#f9c8df;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.reveal span{color:var(--gold)}
.az{position:relative;margin-top:20px;height:470px}
.lock .az>*,.lock .pass{opacity:.35;pointer-events:none}
.lock .az::after{content:'❄️';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;pointer-events:none;animation:cdz .5s both}
/* choice */
.opts{display:grid;gap:16px;height:100%}
.opts.n2{grid-template-columns:1fr 1fr}
.opts.n3{grid-template-rows:repeat(3,1fr)}
.opts.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.opt{border-radius:24px;background:#fff;color:var(--ink);font-size:34px;font-weight:600;padding:10px 20px;line-height:1.2;box-shadow:0 7px 0 rgba(0,0,0,.18)}
.opt.long{font-size:26px}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.opt.right{background:#d4f6e8;color:#0d6b4a;box-shadow:0 0 0 6px var(--mint)}
.opt.wrong{background:#ffe0e4;color:#a3172b}
.opt.out{opacity:.4}
.tf .opt{font-size:52px}
/* tap */
.taps{height:100%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:16px;background:rgba(255,255,255,.14);border-radius:28px;padding:20px}
.taps .opt{font-size:38px;padding:18px 26px}
/* keyboard */
.tdisp{height:96px;background:rgba(255,255,255,.95);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:var(--ink);letter-spacing:2px;margin-bottom:16px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.06)}
.tdisp.empty{color:#cdb7c7;font-size:34px;letter-spacing:0}
.tdisp .cur{display:inline-block;width:4px;height:52px;background:var(--rose);margin-left:4px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.kb{display:flex;flex-direction:column;gap:10px;align-items:center}
.kb .kr{display:flex;gap:9px}
.kb button{width:80px;height:78px;border-radius:16px;background:#fff;color:var(--ink);font-size:34px;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.kb button:active,.kb button.pr{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2);background:#ffe3f0}
.kb .wide{width:300px;font-size:26px}
.kb .fn{background:#f6e9f0;width:120px;font-size:30px}
.kb .ok{background:var(--mint);color:#fff;width:200px;font-size:40px;box-shadow:0 5px 0 #138a60}
/* match */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:26px;height:100%}
.mcol{display:flex;flex-direction:column;gap:14px}
.mi{flex:1;border-radius:22px;background:#fff;color:var(--ink);font-size:28px;font-weight:600;padding:8px 16px;line-height:1.2;box-shadow:0 6px 0 rgba(0,0,0,.18);border:5px solid transparent}
.mi.sel{border-color:var(--gold);background:#fff8de;transform:scale(1.03)}
.mi.done{opacity:.9;box-shadow:none;pointer-events:none}
.mi.bad{background:#ffe0e4;animation:shake .4s}
.mi.c0{background:#d4f6e8;border-color:#1fbf86}.mi.c1{background:#dbeaff;border-color:#4b8df2}.mi.c2{background:#fff1c2;border-color:#e0a92e}.mi.c3{background:#f3e6ff;border-color:#a066e8}
/* order */
.built{min-height:150px;background:rgba(255,255,255,.95);border-radius:24px;padding:16px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px;margin-bottom:18px;position:relative}
.built:empty::before{content:'Tap the pieces in order ↓';color:#cdb7c7;font-size:30px;margin:auto}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;min-height:180px;align-content:flex-start}
.tile{border-radius:18px;background:#fff;color:var(--ink);font-size:32px;font-weight:600;padding:14px 22px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.built .tile{background:#fff0f6;box-shadow:0 4px 0 #f0bcd6;font-size:30px}
.half.R .built .tile{background:#f3eeff;box-shadow:0 4px 0 #d6c8fa}
.clr{position:absolute;right:0;bottom:0;font-size:20px;font-weight:700;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.25);color:#fff}
.plus{position:absolute;font-size:110px;font-weight:700;color:#fff;text-shadow:0 6px 0 rgba(31,191,134,.8);pointer-events:none;animation:plus 1s ease-out forwards;z-index:5}
@keyframes plus{from{transform:translateY(0) scale(.5);opacity:1}to{transform:translateY(-160px) scale(1.2);opacity:0}}
#hud{position:absolute;left:50%;top:0;transform:translateX(-50%);width:600px;height:142px;background:var(--plum);border-radius:0 0 40px 40px;z-index:4;display:flex;flex-direction:column;align-items:center;color:#fff;box-shadow:0 10px 30px rgba(59,18,56,.35);border:4px solid rgba(255,255,255,.4);border-top:none}
#hud .rd{font-size:19px;font-weight:700;color:#ffb3d4;letter-spacing:3px;margin-top:6px}
#hud .tm{font-size:68px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#hud .tm.low{color:#ff8fa3;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#hud .ctl{display:flex;gap:8px;margin-top:4px}
#hud .ctl button{font-size:16px;font-weight:700;padding:5px 12px;border-radius:9px;background:rgba(255,255,255,.16);color:#fff}
.tug{position:absolute;left:50%;top:156px;transform:translateX(-50%);width:300px;height:20px;border-radius:10px;background:linear-gradient(90deg,#ff7ab6,#a98bff);z-index:4;box-shadow:0 0 0 4px rgba(255,255,255,.5)}
.tug i{position:absolute;top:-12px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#fff;border:5px solid var(--gold);transition:left .5s cubic-bezier(.3,1.5,.5,1);font-style:normal;display:grid;place-items:center;font-size:20px}
.ovl{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(59,18,56,.6)}
.cd{font-size:340px;font-weight:700;color:#fff;text-shadow:0 0 60px rgba(255,79,154,.8);animation:cdz .9s ease-out both}
@keyframes cdz{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:.9}}
.sd{font-size:100px;font-weight:700;color:var(--gold);text-align:center;line-height:1.1;animation:cdz 1.2s both}
.sd small{display:block;font-size:42px;color:#fff}
/* result & champ */
.winner{font-size:110px;font-weight:700;color:#fff;text-shadow:0 8px 0 rgba(0,0,0,.18);line-height:1.05;animation:wpop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes wpop{from{transform:scale(.2);opacity:0}}
.trophy{font-size:190px;animation:float 2s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-24px) rotate(4deg)}}
.lb{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.lb div{background:#fff;border-radius:18px;padding:12px 22px;font-size:26px;font-weight:600;box-shadow:0 8px 20px rgba(214,73,141,.14)}
.lb b{color:var(--rose)}
.cname{font-family:var(--script);font-size:140px;line-height:1.2;background:linear-gradient(90deg,#ff4f9a,#c552f0,#8f5cf7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding:0 30px 20px}
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:30}
#modal{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:rgba(59,18,56,.55)}
#modal.on{display:grid}
#modal .box{background:#fff;border-radius:30px;padding:40px 50px;max-width:1100px;text-align:center;display:flex;flex-direction:column;gap:26px;align-items:center}
#modal .box p{font-size:32px;font-weight:600;color:var(--plum);line-height:1.4}
#modal input{font:inherit;font-size:40px;width:200px;text-align:center;border:3px solid var(--rose);border-radius:16px;padding:8px}
</style></head><body>
<div id="stage">
  <section id="home" class="scr"></section>
  <section id="setup" class="scr"></section>
  <section id="bracket" class="scr"></section>
  <section id="ready" class="scr"></section>
  <section id="match" class="scr"></section>
  <section id="result" class="scr"></section>
  <section id="champ" class="scr"></section>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="modal"><div class="box"></div></div>
</div>
<script>
/* =====================================================================
   GRAMMAR QUEEN CUP · head-to-head grammar race · Grade 6
   Each girl gets her OWN questions on her own half of the screen.
   ===================================================================== */

const LESSONS = [
  {id:1, title:'Simple & Compound Sentences', em:'🌷', c:'#ff6fa8'},
  {id:2, title:'Conjunctions', em:'🎀', c:'#b26cf0'},
  {id:3, title:'Complex Sentences', em:'🦋', c:'#5b8cf2'},
  {id:4, title:'Fragments & Run-ons', em:'🧁', c:'#f2789a'},
  {id:5, title:'Appositives', em:'🌸', c:'#e65cbf'},
  {id:6, title:'Action Verbs & Direct Objects', em:'💃', c:'#8f5cf7'},
  {id:7, title:'Adjectives', em:'🌈', c:'#f08a4b'},
  {id:8, title:'Relative Pronouns & Adverbs', em:'💌', c:'#d15b8f'},
  {id:9, title:'Quotations', em:'💬', c:'#3fa7a0'},
  {id:10, title:'Linking Verbs', em:'🔗', c:'#c86ad8'},
  {id:11, title:'Verb Phrases', em:'✨', c:'#6c7cf0'},
  {id:12, title:'Progressive Verb Forms', em:'🎠', c:'#e4609e'},
];

/* ---------- CLASS LISTS ---------- */
const CLASSES = [
 {id:'6E', names:`15951|Dema Ahmed Mahmoud Abdelsayed Abouelhamd
14489|Elsharifa Fatima Elsayedbakry Ibrahim Bakry

const ORIGINAL = [{"id": "L1-o0", "l": 1, "t": "mcq", "q": "Mia and Leo packed and left.", "o": ["Simple", "Compound", "Complex"], "a": 0, "why": "One shared subject does two actions in one independent clause."}, {"id": "L1-o1", "l": 1, "t": "mcq", "q": "I tried, but the door stayed shut.", "o": ["Simple", "Compound", "Fragment"], "a": 1, "why": "I tried and the door stayed shut are independent clauses."}, {"id": "L1-o2", "l": 1, "t": "fix", "q": "Choose a compound sentence.", "o": ["The dog barked and ran.", "The dog barked, and I woke up.", "Because the dog barked."], "a": 1, "why": "Each side has its own complete subject–verb message."}, {"id": "L1-o3", "l": 1, "t": "blank", "q": "The bell rang ___ we hurried inside. (No joining word.)", "o": ["; ", ", ", ": "], "a": 0, "why": "A semicolon can join these independent clauses."}, {"id": "L1-o4", "l": 1, "t": "mcq", "q": "What is the subject in “The small birds sang”?", "o": ["small", "The small birds", "sang"], "a": 1, "why": "The small birds is the complete subject; birds is its head noun."}, {"id": "L1-o5", "l": 1, "t": "mcq", "q": "She opened the book and smiled.", "o": ["Simple", "Compound", "Compound-complex"], "a": 0, "why": "Opened and smiled share she. There is one independent clause."}, {"id": "L1-o6", "l": 1, "t": "fix", "q": "Which join is correct?", "o": ["I was hungry, I ate.", "I was hungry; I ate.", "I was hungry; so I ate."], "a": 1, "why": "The semicolon joins two related complete clauses."}, {"id": "L1-o7", "l": 1, "t": "mcq", "q": "A compound sentence must contain…", "o": ["two adjectives", "two or more independent clauses", "a because clause"], "a": 1, "why": "Independent clauses are the defining feature."}, {"id": "L2-o0", "l": 2, "t": "blank", "q": "We were thirsty, ___ we drank water.", "o": ["so", "yet", "nor"], "a": 0, "why": "So shows the result of being thirsty."}, {"id": "L2-o1", "l": 2, "t": "blank", "q": "I wanted to go, ___ I had to stay.", "o": ["for", "but", "so"], "a": 1, "why": "But marks a contrast between wish and reality."}, {"id": "L2-o2", "l": 2, "t": "blank", "q": "Both Mia ___ Leo helped.", "o": ["or", "nor", "and"], "a": 2, "why": "Both pairs with and."}, {"id": "L2-o3", "l": 2, "t": "blank", "q": "Neither the players nor the coach ___ ready.", "o": ["are", "is", "be"], "a": 1, "why": "Coach is the nearer singular subject, so is agrees."}, {"id": "L2-o4", "l": 2, "t": "mcq", "q": "“A present for you”: for is a…", "o": ["coordinating conjunction", "preposition", "relative pronoun"], "a": 1, "why": "For introduces the phrase for you; it does not join clauses."}, {"id": "L2-o5", "l": 2, "t": "blank", "q": "I trained hard, ___ I lost. Which stresses surprise?", "o": ["and", "yet", "for"], "a": 1, "why": "Yet emphasises an unexpected contrast; but could also express contrast."}, {"id": "L2-o6", "l": 2, "t": "fix", "q": "Choose parallel paired wording.", "o": ["She is both patient and kind.", "She both is patient and kindness.", "She is both patient or kind."], "a": 0, "why": "Patient and kind are parallel adjectives joined by both/and."}, {"id": "L2-o7", "l": 2, "t": "fix", "q": "Which sentence needs a comma in the handbook pattern?", "o": ["Mia sang and danced.", "Mia sang and Leo danced.", "Mia and Leo danced."], "a": 1, "why": "Mia sang and Leo danced are independent clauses: Mia sang, and Leo danced."}, {"id": "L3-o0", "l": 3, "t": "mcq", "q": "Because the bus was late, we walked. Which part is dependent?", "o": ["we walked", "Because the bus was late", "the bus"], "a": 1, "why": "Because makes this subject–verb clause dependent."}, {"id": "L3-o1", "l": 3, "t": "fix", "q": "Choose a complete complex sentence.", "o": ["Although I tried.", "I tried, and I succeeded.", "Although I tried, I failed."], "a": 2, "why": "It has one dependent clause and one independent clause."}, {"id": "L3-o2", "l": 3, "t": "blank", "q": "___ you finish, you may leave. Choose a condition.", "o": ["If", "Yet", "And"], "a": 0, "why": "If sets the condition for leaving."}, {"id": "L3-o3", "l": 3, "t": "fix", "q": "Choose the usual comma pattern.", "o": ["When it rained we stopped.", "When it rained, we stopped.", "When, it rained we stopped."], "a": 1, "why": "The introductory dependent clause is followed by a comma."}, {"id": "L3-o4", "l": 3, "t": "mcq", "q": "We waited until the bus arrived.", "o": ["Simple", "Complex", "Fragment"], "a": 1, "why": "We waited is independent; until the bus arrived is dependent."}, {"id": "L3-o5", "l": 3, "t": "mcq", "q": "I like soup, and I eat it when it is cold.", "o": ["Simple", "Compound only", "Compound-complex"], "a": 2, "why": "Two independent clauses are joined by and; when it is cold adds a dependent clause."}, {"id": "L3-o6", "l": 3, "t": "mcq", "q": "The rain stopped; however, we stayed inside.", "o": ["Compound", "Complex", "Fragment"], "a": 0, "why": "The semicolon joins two independent clauses. However is a linking adverb, not a subordinator."}, {"id": "L3-o7", "l": 3, "t": "mcq", "q": "Which normally fits before a following reason clause?", "o": ["a semicolon", "no separating punctuation", "a full stop"], "a": 1, "why": "We stayed inside because it rained is the usual continuous sentence."}, {"id": "L4-o0", "l": 4, "t": "mcq", "q": "Under the old bridge.", "o": ["Complete", "Fragment", "Compound"], "a": 1, "why": "This prepositional phrase has no independent clause."}, {"id": "L4-o1", "l": 4, "t": "mcq", "q": "We ran we caught the bus.", "o": ["Fragment", "Fused run-on", "Correct"], "a": 1, "why": "Two independent clauses have no boundary."}, {"id": "L4-o2", "l": 4, "t": "mcq", "q": "We ran, we caught the bus.", "o": ["Comma splice", "Simple", "Correct formal join"], "a": 0, "why": "The comma alone joins two independent clauses incorrectly here."}, {"id": "L4-o3", "l": 4, "t": "fix", "q": "Choose a repair.", "o": ["I was tired, I rested.", "I was tired; I rested.", "Because I was tired."], "a": 1, "why": "The semicolon provides a valid clause boundary."}, {"id": "L4-o4", "l": 4, "t": "mcq", "q": "Because I was tired, I rested.", "o": ["Fragment", "Complete complex sentence", "Run-on"], "a": 1, "why": "The independent clause I rested completes the dependent reason clause."}, {"id": "L4-o5", "l": 4, "t": "mcq", "q": "Running along the path. What is needed for a formal complete sentence?", "o": ["a longer adjective", "a subject and finite verb structure", "a comma at the end"], "a": 1, "why": "Mia was running along the path supplies a subject and a finite helping verb."}, {"id": "L4-o6", "l": 4, "t": "fix", "q": "Which is a correct imperative?", "o": ["Close the door.", "Closing the door.", "Because the door."], "a": 0, "why": "Close the door is complete: the subject you is understood in an imperative."}, {"id": "L4-o7", "l": 4, "t": "tf", "q": "A very long sentence is always a run-on.", "o": ["True", "False", "Only with adjectives"], "a": 1, "why": "Correct boundaries, not length, determine whether a sentence is a run-on."}, {"id": "L5-o0", "l": 5, "t": "mcq", "q": "Leo, our captain, scored. Which is the appositive?", "o": ["Leo", "our captain", "scored"], "a": 1, "why": "Our captain renames Leo."}, {"id": "L5-o1", "l": 5, "t": "mcq", "q": "An appositive is normally a…", "o": ["noun or noun phrase", "coordinating conjunction", "finite verb"], "a": 0, "why": "It names or renames another noun."}, {"id": "L5-o2", "l": 5, "t": "fix", "q": "Choose punctuation for extra information.", "o": ["Mia our only guide arrived.", "Mia, our only guide, arrived.", "Mia, our only guide arrived."], "a": 1, "why": "The middle appositive needs both boundary commas."}, {"id": "L5-o3", "l": 5, "t": "fix", "q": "Which is a relative clause rather than an appositive?", "o": ["a talented cook", "our new teacher", "who teaches English"], "a": 2, "why": "Who teaches English contains a verb and is a clause."}, {"id": "L5-o4", "l": 5, "t": "mcq", "q": "In a group of several poets, “the poet Rumi” usually has…", "o": ["no commas around Rumi", "one comma after poet", "a semicolon"], "a": 0, "why": "Rumi identifies which poet."}, {"id": "L5-o5", "l": 5, "t": "mcq", "q": "We visited the studio, a bright room upstairs. The phrase renames…", "o": ["We", "the studio", "upstairs"], "a": 1, "why": "A bright room upstairs renames the studio."}, {"id": "L5-o6", "l": 5, "t": "tf", "q": "The removal test alone always decides appositive commas.", "o": ["True", "False", "Only with names"], "a": 1, "why": "A sentence may remain grammatical yet lose needed identification. Context matters."}, {"id": "L5-o7", "l": 5, "t": "fix", "q": "Which places the appositive clearly?", "o": ["A violinist, my bicycle belongs to Leo.", "Leo, a violinist, owns this bicycle.", "Leo owns, a violinist, this bicycle."], "a": 1, "why": "A violinist sits beside and renames Leo."}, {"id": "L6-o0", "l": 6, "t": "mcq", "q": "Mia kicked the ball. The direct object is…", "o": ["Mia", "kicked", "the ball"], "a": 2, "why": "Kicked what? The ball."}, {"id": "L6-o1", "l": 6, "t": "mcq", "q": "Mia ran quickly. The direct object is…", "o": ["Mia", "quickly", "none"], "a": 2, "why": "Quickly is an adverb; ran has no direct object here."}, {"id": "L6-o2", "l": 6, "t": "mcq", "q": "Leo gave Mia a map. The indirect object is…", "o": ["Leo", "Mia", "a map"], "a": 1, "why": "Mia receives the map; a map is the direct object."}, {"id": "L6-o3", "l": 6, "t": "mcq", "q": "We walked to the library. “the library” is…", "o": ["a direct object", "the object of to", "the subject"], "a": 1, "why": "To the library is a prepositional phrase."}, {"id": "L6-o4", "l": 6, "t": "mcq", "q": "The soup smells delicious. Smells is…", "o": ["action here", "linking here", "a noun"], "a": 1, "why": "It connects soup to a description rather than taking an object."}, {"id": "L6-o5", "l": 6, "t": "mcq", "q": "The chef prepared a hot meal. Choose the complete direct object.", "o": ["meal", "a hot meal", "The chef"], "a": 1, "why": "Meal is the head noun; a hot meal is the whole object phrase."}, {"id": "L6-o6", "l": 6, "t": "mcq", "q": "She bought bread and milk.", "o": ["Two coordinated direct objects", "No direct object", "Two subjects"], "a": 0, "why": "Bought what? Bread and milk."}, {"id": "L6-o7", "l": 6, "t": "mcq", "q": "They praised him. Which is the direct object?", "o": ["They", "praised", "him"], "a": 2, "why": "Praised whom? Him. Objects can be pronouns."}, {"id": "L7-o0", "l": 7, "t": "mcq", "q": "The bright room is quiet. Which are descriptive adjectives?", "o": ["bright and quiet", "The and is", "room and quiet"], "a": 0, "why": "Both bright and quiet describe room."}, {"id": "L7-o1", "l": 7, "t": "mcq", "q": "In “very cold water”, very is…", "o": ["a noun", "an adverb", "a descriptive adjective"], "a": 1, "why": "Very modifies cold, an adjective."}, {"id": "L7-o2", "l": 7, "t": "mcq", "q": "A precise replacement for “very cold” is…", "o": ["nice", "freezing", "big"], "a": 1, "why": "Freezing conveys the temperature more precisely."}, {"id": "L7-o3", "l": 7, "t": "mcq", "q": "Which is a proper adjective?", "o": ["Italian", "quiet", "small"], "a": 0, "why": "Italian is formed from a proper place name and is capitalised."}, {"id": "L7-o4", "l": 7, "t": "mcq", "q": "“Those shoes”: those tells…", "o": ["which ones", "how the action happened", "what tense"], "a": 0, "why": "Those points out a particular set of shoes."}, {"id": "L7-o5", "l": 7, "t": "mcq", "q": "“Seven birds”: seven tells…", "o": ["what kind", "how many", "how much speed"], "a": 1, "why": "Seven gives a number."}, {"id": "L7-o6", "l": 7, "t": "fix", "q": "Choose the more usual adjective order.", "o": ["a leather brown old bag", "an old brown leather bag", "a brown leather old bag"], "a": 1, "why": "Age usually comes before colour, then material."}, {"id": "L7-o7", "l": 7, "t": "mcq", "q": "The soup is hot. Hot is a…", "o": ["predicate adjective", "direct object", "helping verb"], "a": 0, "why": "Hot follows a linking verb and describes soup."}, {"id": "L8-o0", "l": 8, "t": "blank", "q": "The girl ___ won is my friend.", "o": ["whom", "who", "whose"], "a": 1, "why": "Who is the subject of won."}, {"id": "L8-o1", "l": 8, "t": "blank", "q": "The person ___ I invited… Which is the formal object form?", "o": ["whom", "whose", "which"], "a": 0, "why": "I invited him/her, so formal whom fits. Who is common informally."}, {"id": "L8-o2", "l": 8, "t": "blank", "q": "The girl ___ bag is missing…", "o": ["who", "whose", "whom"], "a": 1, "why": "Whose marks possession of the bag."}, {"id": "L8-o3", "l": 8, "t": "blank", "q": "My bike, ___ is blue, is outside.", "o": ["that", "which", "where"], "a": 1, "why": "A non-defining clause about a thing uses which, not that."}, {"id": "L8-o4", "l": 8, "t": "mcq", "q": "The book which I borrowed was useful. In British English this is…", "o": ["incorrect only because of which", "a valid defining relative clause", "a comma splice"], "a": 1, "why": "Which is allowed in defining clauses in British English; that also works."}, {"id": "L8-o5", "l": 8, "t": "blank", "q": "This is the room ___ we met.", "o": ["where", "whom", "whose"], "a": 0, "why": "Where supplies the place relationship: in which we met."}, {"id": "L8-o6", "l": 8, "t": "mcq", "q": "“Students who passed celebrated” means…", "o": ["all students definitely passed", "the students who passed celebrated", "nobody celebrated"], "a": 1, "why": "The defining clause limits the group to those who passed."}, {"id": "L8-o7", "l": 8, "t": "fix", "q": "Which identifies the direct object of visited?", "o": ["the town where I visited", "the town that I visited", "the town when I visited"], "a": 1, "why": "Visited takes town as its object, so that fits; which also fits."}, {"id": "L9-o0", "l": 9, "t": "fix", "q": "Choose classroom dialogue punctuation.", "o": ["“I am ready.” she said.", "“I am ready,” she said.", "“I am ready”, she said."], "a": 1, "why": "Use a comma inside the closing mark before a following statement tag."}, {"id": "L9-o1", "l": 9, "t": "fix", "q": "Choose question + tag punctuation.", "o": ["“Ready?,” she asked.", "“Ready?” She asked.", "“Ready?” she asked."], "a": 2, "why": "The question mark stays; no additional comma is needed. The tag continues in lower case."}, {"id": "L9-o2", "l": 9, "t": "mcq", "q": "Leo said that he was ready.", "o": ["Direct speech", "Reported speech", "Appositive"], "a": 1, "why": "The sentence reports meaning without quotation marks."}, {"id": "L9-o3", "l": 9, "t": "tf", "q": "An indirect report proves the speaker’s exact wording.", "o": ["True", "False", "Only if it uses that"], "a": 1, "why": "Several original wordings may lead to the same report."}, {"id": "L9-o4", "l": 9, "t": "tf", "q": "When converting a report into a fictional direct quote, said must become says.", "o": ["True", "False", "Only for questions"], "a": 1, "why": "The reporting verb may stay said: “I am ready,” Leo said."}, {"id": "L9-o5", "l": 9, "t": "mcq", "q": "A new speaker in a story normally gets…", "o": ["a new paragraph", "a semicolon only", "no punctuation"], "a": 0, "why": "A new paragraph helps the reader follow who speaks."}, {"id": "L9-o6", "l": 9, "t": "fix", "q": "Choose a split spoken sentence.", "o": ["“If it rains,” she said, “we will wait.”", "“If it rains.” she said “We will wait.”", "“If it rains,” She said, “We will wait.”"], "a": 0, "why": "The second speech segment continues the same sentence, so we is lower case."}, {"id": "L9-o7", "l": 9, "t": "mcq", "q": "A fictional “famous-person quote” should be…", "o": ["presented as verified", "clearly labelled invented", "left unattributed but claimed true"], "a": 1, "why": "Do not attribute invented words as a real quotation."}, {"id": "L10-o0", "l": 10, "t": "mcq", "q": "The soup tastes salty. Tastes is…", "o": ["linking", "action with a direct object", "helping"], "a": 0, "why": "Salty describes soup."}, {"id": "L10-o1", "l": 10, "t": "mcq", "q": "Leo tasted the soup. Tasted is…", "o": ["linking", "action", "an adjective"], "a": 1, "why": "Leo performs tasting; the soup is the object."}, {"id": "L10-o2", "l": 10, "t": "mcq", "q": "Mia became captain. Captain is…", "o": ["a direct object", "a predicate nominative", "a helping verb"], "a": 1, "why": "Captain renames Mia after became."}, {"id": "L10-o3", "l": 10, "t": "mcq", "q": "The sky looks dark. Dark is…", "o": ["a predicate adjective", "an indirect object", "a noun subject"], "a": 0, "why": "Dark describes sky after looks."}, {"id": "L10-o4", "l": 10, "t": "mcq", "q": "The flowers smell wonderful. The subject is…", "o": ["wonderful", "smell", "The flowers"], "a": 2, "why": "The flowers is what the sentence describes."}, {"id": "L10-o5", "l": 10, "t": "fix", "q": "Which uses grew as a linking verb?", "o": ["She grew flowers.", "The flowers grew tall.", "She grew three roses."], "a": 1, "why": "Tall describes the flowers; the other examples take objects."}, {"id": "L10-o6", "l": 10, "t": "mcq", "q": "Which uses a noun complement?", "o": ["Mia is cheerful.", "Mia is a guide.", "Mia smiled."], "a": 1, "why": "A guide renames Mia. Cheerful is an adjective instead."}, {"id": "L10-o7", "l": 10, "t": "mcq", "q": "The is/are swap is…", "o": ["a useful clue, checked with meaning", "proof every time", "only for direct objects"], "a": 0, "why": "Confirm that the complement actually describes or renames the subject."}, {"id": "L11-o0", "l": 11, "t": "mcq", "q": "She has been reading. The verb words are…", "o": ["has reading", "has been reading", "She has been"], "a": 1, "why": "Has and been help the main verb reading."}, {"id": "L11-o1", "l": 11, "t": "mcq", "q": "She might not have finished. List the handbook’s verb words.", "o": ["might not have finished", "might have finished", "not have"], "a": 1, "why": "Might and have help finished; not is not a verb word."}, {"id": "L11-o2", "l": 11, "t": "mcq", "q": "Have you ever been there? The verb words are…", "o": ["Have been", "you ever", "ever been there"], "a": 0, "why": "Have helps been; subject and adverb interrupt them."}, {"id": function parseList(txt){
  const rows=String(txt||'').split(/\r?\n/).map(l=>l.split('\t').map(c=>c.trim())).filter(r=>r.some(Boolean));
  if(!rows.length) return [];
  const n=Math.max(...rows.map(r=>r.length));let best=0,bs=-1;
  for(let c=0;c<n;c++){const s=rows.reduce((a,r)=>a+((r[c]||'').match(/[A-Za-z؀-ۿ]/g)||[]).length,0);if(s>bs){bs=s;best=c;}}
  const seen=new Set(),out=[];
  rows.forEach(r=>{let v=(r[best]||'').replace(/\s+/g,' ').trim();if(!v||/^(names?|student'?s? ?names?|full names?|الاسم|اسم)$/i.test(v))return;
    v=v.split(' ').slice(0,2).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');if(seen.has(v.toLowerCase()))return;seen.add(v.toLowerCase());out.push(v);});
  return out;
}

/* ---------- confetti ---------- */
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxOn=false;
function confetti(n=220,x=960){const cols=['#ff4f9a','#ffb3d4','#8f5cf7','#d9c6ff','#ffd166','#7fe0c0','#fff'],em=['💖','✨','🌸','🎀'];
  for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-.5)*700,y:-20-Math.random()*300,vx:(Math.random()-.5)*9,vy:Math.random()*4+2,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,s:Math.random()*12+8,c:cols[i%cols.length],e:Math.random()<.15?pick(em):null,life:320});
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop);}}
function fxLoop(){fctx.clearRect(0,0,1920,1080);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.r+=p.vr;p.life--;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);
  if(p.e){fctx.font=(p.s*2.4)+'px serif';fctx.fillText(p.e,0,0);}else{fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);}fctx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<1150);if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fctx.clearRect(0,0,1920,1080);}}

const present=()=>STUDENTS.filter(s=>!S.absent.includes(s));
function makeBracket(){const ps=shuffle(present()),n=ps.length;if(n<2)return null;const size=2**Math.ceil(Math.log2(n)),half=size/2;
  const pairs=[];for(let i=0;i<half;i++)pairs.push({a:ps[i],b:null});for(let i=half;i<n;i++)pairs[i-half].b=ps[i];
  const r0=shuffle(pairs).map(p=>Math.random()<.5&&p.b?{a:p.b,b:p.a}:p);const rounds=[r0.map((p,i)=>({id:'0-'+i,a:p.a,b:p.b,bye:!p.b,w:p.b?null:p.a,sa:0,sb:0}))];
  for(let r=1,m=half/2;m>=1;r++,m/=2){rounds.push(Array.from({length:m},(_,i)=>({id:r+'-'+i,a:null,b:null,w:null,sa:0,sb:0})));}
  return {rounds};}
function propagate(){const R=S.bracket.rounds;for(let r=1;r<R.length;r++)R[r].forEach((m,i)=>{const a=R[r-1][2*i].w,b=R[r-1][2*i+1].w;if(m.a!==a||m.b!==b){m.a=a;m.b=b;m.w=null;m.sa=m.sb=0;}});}
function roundName(r,R){const f=R-1-r;return f===0?'THE FINAL':f===1?'SEMI-FINAL':f===2?'QUARTER-FINAL':`ROUND OF ${2**(R-r)}`;}
const realMatches=()=>S.bracket?S.bracket.rounds.flat().filter(m=>!m.bye):[];
const remaining=()=>realMatches().filter(m=>!m.w);
const weight=m=>{const R=S.bracket.rounds.length,r=+m.id.split('-')[0],f=R-1-r;return f===0?1.6:f===1?1.25:1;};
function timeLeftSec(){return S.endAt?(S.endAt-Date.now())/1000:S.totalMin*60;}
function plannedDur(m){if(S.mode==='fixed')return S.fixedSec;const rem=remaining();if(!rem.length)return 60;const ws=rem.reduce((s,x)=>s+weight(x),0);const base=(timeLeftSec()-S.changeSec*rem.length)/ws;return Math.max(30,Math.min(300,Math.round(base*weight(m)/5)*5));}
function nextReady(){return realMatches().find(m=>!m.w&&m.a&&m.b);}
function findMatch(id){return S.bracket.rounds.flat().find(m=>m.id===id);}
function poolNow(){return BANK.filter(q=>S.lessons.includes(q.l)&&S.styles.includes(styleOf(q)));}

    S.log.pop();m.w=null;m.sa=m.sb=0;(last.stats||[]).forEach(([n,c])=>{if(S.stats[n])S.stats[n].c-=c;});save();goBracket();};

/* =====================================================================
   MATCH ENGINE
   ===================================================================== */
let M=null,raf=null,lastT=0;
function startMatch(m,dur,demo,label){
  if(!CLS)S=DEF();
  if(!demo&&!S.endAt&&S.mode==='auto'){S.endAt=Date.now()+S.totalMin*60000;save();}
  const pool=poolNow();
  M={m,dur,left:dur,demo,label,pool,slots:[],seen:new Set(),running:false,paused:false,sudden:false,over:false,
     p:[0,1].map(i=>({name:i?m.b:m.a,score:0,correct:0,streak:0,k:0,q:null,wrong:0,lock:0,after:null,input:'',sel:null,matched:[],built:[],out:false}))};
  const el=$('#match');
  el.innerHTML=`${[0,1].map(i=>`<div class="half ${i?'R':'L'}" id="h${i}"><div class="ph"><div class="score" id="sc${i}">0</div><div class="nm">${esc(M.p[i].name)}</div><div class="streak" id="st${i}"></div></div>
     <div class="qc" id="qc${i}"></div><div class="az" id="az${i}"></div></div>`).join('')}
   <div id="hud"><div class="rd">${label}</div><div class="tm" id="tm">${mmss(dur)}</div><div class="ctl"><button id="cPause">❚❚ Pause</button><button id="cMinus">−30s</button><button id="cPlus">+30s</button><button id="cEnd">End now</button><button id="cExit">✕</button></div></div>
   <div class="tug"><i id="tug">💖</i></div>`;
  [0,1].forEach(i=>$('#h'+i).addEventListener('pointerdown',e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();b.classList.add('pr');setTimeout(()=>b.classList.remove('pr'),120);act(i,b.dataset.a,b.dataset.v);}));
  $('#cPause').onclick=()=>{if(!M.running||M.over)return;M.paused=!M.paused;$('#cPause').textContent=M.paused?'▶ Resume':'❚❚ Pause';overlay(M.paused?'<div class="sd">PAUSED</div>':null);};
  $('#cPlus').onclick=()=>{M.left+=30;tickUI();};$('#cMinus').onclick=()=>{M.left=Math.max(1,M.left-30);tickUI();};
  $('#cEnd').onclick=()=>{if(M.running&&!M.sudden)M.left=0;};
  $('#cExit').onclick=async()=>{const wasP=M.paused;M.paused=true;if(await ask('Leave this match? The result will NOT be saved.','Leave match','Keep playing')){stopMatch();M.demo?renderHome():goBracket();}else M.paused=wasP;};
  [0,1].forEach(i=>{$('#qc'+i).innerHTML='<div class="qq" style="color:#cdb7c7">Get ready…</div>';$('#az'+i).innerHTML='';});
  tug();show('match');countdown(()=>{M.running=true;[0,1].forEach(i=>newQ(i));loop();});}
function overlay(html){let o=$('#mOv');if(!html){o&&o.remove();return;}if(!o){o=document.createElement('div');o.id='mOv';o.className='ovl';$('#match').appendChild(o);}o.innerHTML=html;}
function countdown(done){let n=3;const step=()=>{if(n>0){overlay(`<div class="cd">${n}</div>`);SFX.tick();n--;setTimeout(step,850);}else{overlay('<div class="cd" style="color:#ffd166">GO!</div>');SFX.go();setTimeout(()=>{overlay(null);done();},600);}};step();}
function loop(){lastT=performance.now();clearInterval(raf);const f=()=>{const t=performance.now();if(!M||M.over){clearInterval(raf);return;}const dt=(t-lastT)/1000;lastT=t;
    if(M.running&&!M.paused){if(!M.sudden){const before=Math.ceil(M.left);M.left-=dt;if(Math.ceil(M.left)!==before&&M.left<=10&&M.left>0)SFX.tick();if(M.left<=0){M.left=0;timeUp();}}
      M.p.forEach((p,i)=>{if(p.lock>0){p.lock-=dt;if(p.lock<=0){p.lock=0;$('#h'+i).classList.remove('lock');if(p.after){const a=p.after;p.after=null;a();}}}});}
    tickUI();};raf=setInterval(f,100);}
function tickUI(){const t=$('#tm');if(!t||!M)return;t.textContent=M.sudden?'⚡':mmss(M.left);t.classList.toggle('low',!M.sudden&&M.left<=10);}
function stopMatch(){if(M)M.over=true;clearInterval(raf);}

/* ----- choosing questions: both girls get the same STYLE in the same order, but different questions ----- */
function slotStyle(k){
  const avail=Object.keys(STYLES).filter(s=>M.pool.some(q=>styleOf(q)===s));
  while(M.slots.length<=k){const prev=M.slots[M.slots.length-1];let s;let tries=0;
    do{let r=Math.random()*avail.reduce((a,x)=>a+STYLES[x].w,0);s=avail.find(x=>(r-=STYLES[x].w)<0)||avail[0];}while(avail.length>1&&s===prev&&s!=='choose'&&++tries<10);
    M.slots.push(s);}
  return M.slots[k];
}
function drawQ(i,style){
  const other=M.p[1-i].q;let c=M.pool.filter(q=>styleOf(q)===style);
  const fresh=c.filter(q=>!M.seen.has(q.id)&&(!other||other.id!==q.id));
  const unused=fresh.filter(q=>!S.used.includes(q.id));
  const q=pick(unused.length?unused:fresh.length?fresh:c.filter(q=>!other||other.id!==q.id).length?c.filter(q=>!other||other.id!==q.id):c);
  M.seen.add(q.id);if(!M.demo&&!S.used.includes(q.id)){S.used.push(q.id);if(S.used.length>600)S.used.shift();}
  return prepQ(q);
}
function prepQ(q){
  if(q.t==='match'){const ps=[],rs=new Set();for(const p of shuffle(q.pairs)){if(!rs.has(p[1])&&ps.length<3){ps.push(p);rs.add(p[1]);}}
    return {...q,L:ps.map(p=>p[0]),A:ps.map(p=>p[1]),Rt:shuffle(ps.map(p=>p[1]))};}
  if(q.t==='order'){let sh;do sh=shuffle(q.tiles.map((_,i)=>i));while(q.tiles.length>1&&sh.every((v,i)=>v===i));return {...q,sh};}
  if(q.t==='tap'||q.t==='tf'||q.t==='type')return {...q};
  const order=shuffle(q.o.map((_,i)=>i));return {...q,o:order.map(i=>q.o[i]),a:order.indexOf(q.a)};
}
function newQ(i,shared){const p=M.p[i];p.q=shared||drawQ(i,slotStyle(p.k++));p.input='';p.wrong=0;p.sel=null;p.matched=[];p.built=[];p.out=false;renderQ(i);}

/* ----- drawing a question on one half ----- */
function answerText(q){return q.t==='type'?q.ans[0]:q.t==='order'?q.tiles.join(' '):q.t==='match'?q.L.map((l,k)=>`${l} → ${q.A[k]}`).join('<br>'):q.o[q.a];}
function fs(text,base){const n=text.replace(/<[^>]+>/g,'').length;return n<36?base:n<64?base*.85:n<100?base*.72:base*.62;}
function renderQ(i){const p=M.p[i],q=p.q,L=lessonOf(q.l),c=$('#qc'+i),az=$('#az'+i);
  const qhtml=esc(q.q).replace(/_{3,}/g,'<span class="blank"></span>');
  c.innerHTML=`<div class="qt">${L.em} Lesson ${L.id} <i>${TLABEL[q.t]}${PTS[q.t]>1&&!M.sudden?' · +2':''}</i>${M.sudden?'<i>⚡ SUDDEN DEATH</i>':''}</div>${M.sudden?'':'<button class="pass" data-a="pass">Pass ⤼</button>'}
    <div class="qq" style="font-size:${fs(q.q,46)}px">${qhtml}</div>`;
  if(q.t==='tap'||q.t==='tf'||['mcq','blank','fix'].includes(q.t)){
    if(q.t==='tap') az.innerHTML=`<div class="taps">${q.o.map((o,k)=>`<button class="opt" data-a="opt" data-v="${k}">${esc(o)}</button>`).join('')}</div>`;
    else{const long=q.o.some(o=>o.length>22);az.innerHTML=`<div class="opts n${Math.min(4,q.o.length)} ${q.t==='tf'?'tf':''}">${q.o.map((o,k)=>`<button class="opt ${long?'long':''}" data-a="opt" data-v="${k}">${esc(o)}</button>`).join('')}</div>`;}
  }else if(q.t==='type'){
    const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
    az.innerHTML=`<div class="tdisp empty" id="td${i}">type your answer…</div><div class="kb">${rows.map((r,ri)=>`<div class="kr">${r.split('').map(k=>`<button data-a="key" data-v="${k}">${k}</button>`).join('')}${ri===2?'<button class="fn" data-a="key" data-v="back">⌫</button>':''}</div>`).join('')}
      <div class="kr"><button class="fn" data-a="key" data-v="-">-</button><button class="wide" data-a="key" data-v=" ">space</button><button class="ok" data-a="key" data-v="ok">✓</button></div></div>`;
    tdisp(i);
  }else if(q.t==='match'){
    az.innerHTML=`<div class="mt"><div class="mcol">${q.L.map((l,k)=>`<button class="mi" data-a="ml" data-v="${k}">${esc(l)}</button>`).join('')}</div><div class="mcol">${q.Rt.map((r,k)=>`<button class="mi" data-a="mr" data-v="${k}">${esc(r)}</button>`).join('')}</div></div>`;
    paintMatch(i);
  }else if(q.t==='order'){ paintOrder(i); }
}
function tdisp(i){const d=$('#td'+i);if(!d)return;const v=M.p[i].input;d.classList.toggle('empty',!v);d.innerHTML=v?esc(v)+'<span class="cur"></span>':'type your answer…';}
function paintMatch(i){const p=M.p[i],q=p.q,az=$('#az'+i);
  $$('[data-a="ml"]',az).forEach(b=>{const k=+b.dataset.v,mi=p.matched.findIndex(x=>x[0]===k);b.className='mi'+(mi>=0?' done c'+mi:p.sel===k?' sel':'');});
  $$('[data-a="mr"]',az).forEach(b=>{const k=+b.dataset.v,mi=p.matched.findIndex(x=>x[1]===k);b.className='mi'+(mi>=0?' done c'+mi:'');});}
function paintOrder(i){const p=M.p[i],q=p.q,az=$('#az'+i);
  az.innerHTML=`<div class="built">${p.built.map((t,k)=>`<button class="tile" data-a="untile" data-v="${k}">${esc(q.tiles[t])}</button>`).join('')}</div>
    <div class="bank">${q.sh.filter(t=>!p.built.includes(t)).map(t=>`<button class="tile" data-a="tile" data-v="${t}">${esc(q.tiles[t])}</button>`).join('')}</div>
    ${p.built.length?'<button class="clr" data-a="clear">↺ Start again</button>':''}`;}

/* ----- answering ----- */
function act(i,a,v){if(!M||!M.running||M.paused||M.over)return;const p=M.p[i];if(p.lock>0||!p.q||p.out)return;const q=p.q;
  if(a==='pass'){if(M.sudden)return;reveal(i,1.3);return;}
  if(a==='opt'){const k=+v;const b=$(`#az${i} [data-v="${k}"]`);
    if(k===q.a){b.classList.add('right');good(i);}else{b.classList.add('wrong');if(M.sudden)return suddenMiss(i);bad(i,true,k);}return;}
  if(a==='key'){SFX.tap();if(v==='back')p.input=p.input.slice(0,-1);else if(v==='ok'){if(!norm(p.input))return;
      if(q.ans.some(x=>norm(x)===norm(p.input)))good(i);else{p.wrong++;if(p.wrong>=2)bad(i,true);else{bad(i,false);p.input='';tdisp(i);}}return;}
    else if(p.input.length<26)p.input+=v;tdisp(i);return;}
  if(a==='ml'){const k=+v;if(p.matched.some(x=>x[0]===k))return;p.sel=k;SFX.tap();paintMatch(i);return;}
  if(a==='mr'){const k=+v;if(p.sel===null||p.matched.some(x=>x[1]===k))return;
    if(q.Rt[k]===q.A[p.sel]){p.matched.push([p.sel,k]);p.sel=null;SFX.tap();paintMatch(i);if(p.matched.length===q.L.length)good(i);}
    else{p.wrong++;const bs=[$(`#az${i} [data-a="ml"][data-v="${p.sel}"]`),$(`#az${i} [data-a="mr"][data-v="${k}"]`)];bs.forEach(b=>b&&b.classList.add('bad'));p.sel=null;
      if(p.wrong>=3)bad(i,true);else{bad(i,false,null,1);setTimeout(()=>paintMatch(i),400);}}return;}
  if(a==='tile'){p.built.push(+v);SFX.tap();paintOrder(i);
    if(p.built.length===q.tiles.length){const s=p.built.map(t=>q.tiles[t]).join(' ');
      if(s===q.tiles.join(' '))good(i);else{p.wrong++;if(p.wrong>=2)bad(i,true);else{bad(i,false);p.after=()=>{p.built=[];paintOrder(i);};}}}return;}
  if(a==='untile'){p.built.splice(+v,1);paintOrder(i);return;}
  if(a==='clear'){p.built=[];paintOrder(i);return;}
}
function good(i){const p=M.p[i],c=$('#qc'+i),pts=M.sudden?1:PTS[p.q.t];p.correct++;p.streak++;p.score+=pts;SFX.ok();
  c.classList.remove('good');void c.offsetWidth;c.classList.add('good');plus(i,pts);
  $('#sc'+i).textContent=p.score;$('#st'+i).textContent=p.streak>=3?'🔥×'+p.streak:'';tug();
  if(M.sudden){finish(i);return;}
  p.lock=.35;p.after=()=>newQ(i);}
function bad(i,revealIt,picked,freeze){const p=M.p[i],c=$('#qc'+i);p.streak=0;$('#st'+i).textContent='';SFX.bad();
  c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');
  if(revealIt){const q=p.q;if(q.a!=null&&q.o){const r=$(`#az${i} [data-v="${q.a}"]`);r&&r.classList.add('right');}reveal(i,Math.max(S.freeze,1.4));}
  else{p.lock=freeze??S.freeze;$('#h'+i).classList.add('lock');}}
function reveal(i,secs){const p=M.p[i],c=$('#qc'+i);const r=document.createElement('div');r.className='reveal';
  r.innerHTML=`<small>The answer</small><div><span>${p.q.t==='match'?answerText(p.q):esc(answerText(p.q))}</span></div>`;if(p.q.t==='match')r.style.fontSize='30px';
  c.appendChild(r);p.lock=secs+(p.q.t==='match'||p.q.t==='order'?.8:0);$('#h'+i).classList.add('lock');p.after=()=>newQ(i);}
function suddenMiss(i){const p=M.p[i];p.out=true;SFX.bad();p.lock=.01;$('#h'+i).classList.add('lock');$$(`#az${i} .opt`).forEach(b=>b.classList.add('out'));
  if(M.p.every(x=>x.out)){setTimeout(()=>{if(!M||M.over)return;suddenQ();},1500);}}
function suddenQ(){const pool=M.pool.filter(q=>['mcq','blank','fix','tf','tap'].includes(q.t));const base=pick(pool.length?pool:BANK.filter(q=>q.t==='mcq'));const q=prepQ(base);
  M.p.forEach((p,i)=>{p.lock=0;p.after=null;$('#h'+i).classList.remove('lock');newQ(i,q);});}
function plus(i,pts){const e=document.createElement('div');e.className='plus';e.textContent='+'+pts;e.style.left=(i?1440:480)-50+'px';e.style.top='420px';$('#match').appendChild(e);setTimeout(()=>e.remove(),1000);}
function tug(){const d=M.p[1].score-M.p[0].score,x=50+Math.max(-45,Math.min(45,d*7));const t=$('#tug');if(t)t.style.left=x+'%';}
function timeUp(){const [a,b]=M.p;if(a.score!==b.score){finish(a.score>b.score?0:1);return;}
  M.paused=true;SFX.horn();overlay(`<div class="sd">⚡ SUDDEN DEATH ⚡<small>${a.score} – ${b.score} · the same question for both · first right answer wins!</small></div>`);
  setTimeout(()=>{if(!M||M.over)return;overlay(null);M.sudden=true;M.paused=false;suddenQ();tickUI();},2600);}
function finish(wi){if(M.over)return;stopMatch();M.running=false;const m=M.m,win=M.p[wi];SFX.end();
  if(!M.demo){m.w=win.name;m.sa=M.p[0].score;m.sb=M.p[1].score;const st=[];M.p.forEach(p=>{S.stats[p.name]=S.stats[p.name]||{c:0};S.stats[p.name].c+=p.correct;st.push([p.name,p.correct]);});S.log.push({id:m.id,stats:st});save();}
  const el=$('#result');const isFinal=!M.demo&&+m.id.split('-')[0]===S.bracket.rounds.length-1;
  el.innerHTML=`<div class="center ${wi?'R':'L'}" style="color:#fff">
    <div style="font-size:38px;font-weight:700;letter-spacing:4px;color:#fff4fa">${M.label} · WINNER</div><div class="trophy">${isFinal?'👑':'🏆'}</div><div class="winner">${esc(win.name)}</div>
    <div style="font-size:64px;font-weight:700">${M.p[0].score} – ${M.p[1].score}${M.sudden?' <span style="font-size:36px">(sudden death)</span>':''}</div>
    <div style="font-size:30px;color:#fff4fa">${esc(M.p[0].name)}: ${M.p[0].correct} right · ${esc(M.p[1].name)}: ${M.p[1].correct} right · Well played, both! 💕</div>
    <div class="row" style="margin-top:20px">${M.demo?'<button class="btn g" id="rsH">⌂ Home</button>':`<button class="btn g" id="rsRe">↻ Replay match</button><button class="btn g" id="rsB" style="font-size:34px;color:var(--rose)">${isFinal?'👑 Crown the champion ▶':'Back to bracket ▶'}</button>`}</div></div>`;
  show('result');confetti(260,wi?1440:480);
  if(M.demo)$('#rsH').onclick=renderHome;else{$('#rsB').onclick=()=>isFinal?goChamp():goBracket();
    $('#rsRe').onclick=async()=>{if(!(await ask('Replay this match? The result just recorded will be removed.','Replay')))return;const last=S.log.pop();(last.stats||[]).forEach(([n,c])=>{S.stats[n].c-=c;});m.w=null;m.sa=m.sb=0;save();goReady(m);};}}

function goChamp(){const B=S.bracket,R=B.rounds.length,fin=B.rounds[R-1][0],champ=fin.w,ru=fin.a===champ?fin.b:fin.a;
  const semis=R>1?B.rounds[R-2].map(m=>m.a===m.w?m.b:m.a).filter(Boolean):[];
  const top=Object.entries(S.stats).sort((a,b)=>b[1].c-a[1].c).slice(0,5);
  $('#champ').innerHTML=`${floaties()}<div class="center" style="gap:16px"><div style="font-size:36px;font-weight:700;letter-spacing:6px;color:var(--lav)">${CLS===LIST_ID?'':'GRADE '+CLS+' · '}GRAMMAR QUEEN</div><div class="trophy" style="font-size:200px">👑</div><div class="cname">${esc(champ)}</div>
   <div class="lb"><div>🥈 Runner-up: <b>${esc(ru)}</b></div>${semis.map(s=>`<div>🥉 Semi-finalist: <b>${esc(s)}</b></div>`).join('')}</div>
   <div style="font-size:28px;font-weight:700;color:var(--roseD);margin-top:14px">⭐ Most right answers in the whole tournament</div><div class="lb">${top.map(([n,v],i)=>`<div>${['🥇','🥈','🥉','4.','5.'][i]} ${esc(n)} · <b>${v.c}</b></div>`).join('')}</div>
   <div class="row" style="margin-top:20px"><button class="btn g" id="cB">👑 View bracket</button><button class="btn" id="cH">⌂ Home</button></div></div>`;
  show('champ');confetti(400);setTimeout(()=>confetti(300,500),900);setTimeout(()=>confetti(300,1400),1600);SFX.end();
  $('#cH').onclick=renderHome;$('#cB').onclick=()=>{goBracket(false,true);$('#bPlay').textContent='👑 Champion';$('#bPlay').disabled=false;$('#bPlay').onclick=goChamp;};}
addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}});
renderHome();
</script></body></html>
